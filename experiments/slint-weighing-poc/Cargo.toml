[package]
name = "labelpilot-slint-weighing-poc"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
labelpilot-core = { package = "labelpilot-tauri", path = "../../src-tauri", default-features = false, features = ["native-ui"] }
serde_json = "1"
slint = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
