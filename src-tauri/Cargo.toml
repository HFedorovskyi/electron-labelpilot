[package]
name = "labelpilot-tauri"
version = "2.0.1"
description = "Parallel Rust desktop runtime for LabelPilot"
edition = "2021"
publish = false

[features]
default = ["desktop"]
desktop = ["native-update", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-build"]
native-ui = []
native-update = []
slint-ui = ["native-ui", "native-update", "dep:slint", "dep:slint-build", "dep:ab_glyph", "dep:image", "dep:rxing"]

[lib]
name = "labelpilot_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "labelpilot-tauri"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "labelpilot-slint"
path = "src/slint_main.rs"
required-features = ["slint-ui"]

[[bin]]
name = "labelpilot-maintenance"
path = "src/maintenance_main.rs"
required-features = ["native-update"]
[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }
slint-build = { version = "1.17.1", optional = true }

[dependencies]
ab_glyph = { version = "0.2.32", optional = true }
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc"] }
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
pbkdf2 = "0.12.2"
labelpilot-contracts = { path = "../native/labelpilot-contracts" }
minisign-verify = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rxing = { version = "=0.9.2", default-features = false, features = ["encoders", "encoding_rs", "full_barcode_format_support"], optional = true }
regex = "1.13.1"
semver = "1.0.27"
serialport = { version = "4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.17.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
sha2 = "0.10.9"
subtle = "2.6.1"
uuid = { version = "1.18.1", features = ["v4"] }
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
time = { version = "0.3", features = ["formatting"] }
zip = { version = "4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
