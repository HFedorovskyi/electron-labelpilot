[package]
name = "labelpilot-tauri"
version = "2.0.0"
description = "Parallel Rust desktop runtime for LabelPilot"
edition = "2021"
publish = false

[lib]
name = "labelpilot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "labelpilot-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes = "0.8.4"
base64 = "0.22.1"
cbc = { version = "0.1.2", features = ["alloc"] }
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
pbkdf2 = "0.12.2"
labelpilot-contracts = { path = "../native/labelpilot-contracts" }
minisign-verify = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex = "1.13.1"
serialport = { version = "4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
uuid = { version = "1.18.1", features = ["v4"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }
zip = { version = "4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_FileSystem"] }
