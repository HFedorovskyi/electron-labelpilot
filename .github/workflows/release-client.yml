name: Build & Release Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия клиента (например: 2.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $requested = '${{ inputs.version }}'
          $version = if ($requested) { $requested } else { '${{ github.ref_name }}' -replace '^v', '' }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion -or $version -ne $tauriVersion) {
            throw "Release version $version differs from package=$packageVersion or tauri=$tauriVersion"
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Tauri migration contracts
        run: npm run test:migration

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build signed Tauri release
        shell: pwsh
        env:
          LABELPILOT_TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LABELPILOT_TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:LABELPILOT_TAURI_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is empty' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'labelpilot-updater.key'
          [IO.File]::WriteAllText($keyPath, $env:LABELPILOT_TAURI_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          $publicKey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          [IO.File]::WriteAllText("$keyPath.pub", $publicKey, [Text.UTF8Encoding]::new($false))
          ./scripts/build-tauri-release.ps1 `
            -ArtifactDirectory 'artifacts/ci-release' `
            -SigningKeyPath $keyPath `
            -SigningKeyPassword $env:LABELPILOT_TAURI_KEY_PASSWORD `
            -SkipTests

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/ci-release/*.exe
            artifacts/ci-release/*.sig
            artifacts/ci-release/latest.json
            artifacts/ci-release/SHA256SUMS.txt
            artifacts/ci-release/verification.log
