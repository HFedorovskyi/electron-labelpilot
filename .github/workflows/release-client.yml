name: Build & Release Client

on:
  push:
    tags:
      - 'v*'    # срабатывает на git tag v1.2.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия клиента (например: 1.2.0)'
        required: true

jobs:
  build:
    runs-on: windows-2022    # pinned: windows-latest moved to VS18/Python3.14 which node-gyp can't use to build better-sqlite3
    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (node-gyp native builds, e.g. better-sqlite3)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: get_version
        run: |
          if ("${{ inputs.version }}" -ne "") {
            echo "VERSION=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Install dependencies
        run: npm install

      - name: Build renderer (Vite)
        run: npm run build

      - name: Build Electron main process
        run: npm run electron:build

      - name: List intermediate artifacts
        run: |
          ls -R dist/
          ls -R dist-electron/
        shell: pwsh

      - name: Build & Package
        run: npx electron-builder --win --publish never

      - name: List final artifacts
        run: ls -R dist-build/
        shell: pwsh

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-build/*.exe
            dist-build/latest.yml
            dist-build/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror the installer to a PUBLIC Supabase Storage bucket so the sales site can
      # serve a stable download URL (works even if this repo is private). The .exe is
      # already on disk from "Build & Package" — upload it directly. Never fails the release.
      - name: Mirror installer to Supabase Storage
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:SUPABASE_URL) -or [string]::IsNullOrEmpty($env:SUPABASE_SERVICE_ROLE_KEY)) {
            Write-Host "Supabase secrets not set - skipping mirror."; exit 0
          }
          $exe = Get-ChildItem dist-build/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "No .exe found - skipping."; exit 0 }
          $base = $env:SUPABASE_URL.TrimEnd('/')
          # Ensure the public "downloads" bucket exists (ignore "already exists").
          try {
            Invoke-RestMethod -Method Post -Uri "$base/storage/v1/bucket" `
              -Headers @{ Authorization = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)"; apikey = $env:SUPABASE_SERVICE_ROLE_KEY; "Content-Type" = "application/json" } `
              -Body '{"id":"downloads","name":"downloads","public":true}'
            Write-Host "Bucket 'downloads' created."
          } catch { Write-Host "Bucket create skipped (likely exists): $($_.Exception.Message)" }
          $headers = @{ Authorization = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)"; "x-upsert" = "true" }
          # Upload under a stable "latest" name (site URL never changes) and the versioned name.
          foreach ($name in @("LabelPilot-Setup-latest.exe", $exe.Name)) {
            $uri = "$base/storage/v1/object/downloads/client/$name"
            Write-Host "Uploading -> $uri"
            Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType "application/octet-stream" -InFile $exe.FullName
          }
          Write-Host "Mirrored installer to Supabase Storage."
